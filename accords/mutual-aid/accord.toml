name = "Mutual Aid"
slug = "mutual-aid"
kind = "everyday"
version = 1
grows-from = "charter >= 2"
licence = "CC-BY-SA-4.0"

[provisions]
resources = ["help request"]
records = ["need.posted", "need.answered", "need.done", "checkin.consented", "checkin.made", "thanks.given"]
roles = ["coordinator"]
rules = [
  "urgent requests are shown to the whole circle",
  "the check-on-me list is opt-in and visible only to coordinators",
  "need first when several requests compete",
]
prompts = ["a request with no reply after a day", "a member on the check-on-me list not heard from in a while"]
views = ["requests", "check-on-me list (coordinators)"]
privacy = "circle; requests may be addressed to named members"
